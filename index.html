<style>
:root{
  --accent:#ff2fd0;
  --accent2:#00f0ff;
  --bg1:#0a0a14;
  --bg2:#140a20;
  --card:#151022;
  --text:#f1eaff;
  --muted:#9b8fc4;
  --radius:16px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --text:#f1eaff; }
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  font-family:'Inter',sans-serif;
  color:var(--text);
  background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 60%);
  background-attachment:fixed;
  overflow-x:hidden;
}
body.has-img{ background-size:cover; background-position:center; }
body.has-img::before{
  content:"";
  position:fixed; inset:0;
  background:rgba(8,6,16,0.72);
  z-index:-1;
}
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.app{ max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

header{
  padding:18px 18px 10px;
  position:sticky; top:0; z-index:5;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg, rgba(10,10,20,0.85), rgba(10,10,20,0));
  backdrop-filter:blur(6px);
}
.title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
h1{
  font-family:'Orbitron',sans-serif;
  font-size:1.5rem; margin:0; letter-spacing:1px;
  color:var(--accent);
  text-shadow:0 0 8px var(--accent), 0 0 22px var(--accent);
}
.icon-btn{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  color:var(--text); width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  cursor:pointer;
}
.clock{
  margin-top:10px; padding:12px 14px; border-radius:var(--radius);
  background:rgba(255,255,255,0.04);
  border:1px solid var(--accent2);
  box-shadow:0 0 14px -2px var(--accent2) inset, 0 0 18px -6px var(--accent2);
  display:flex; justify-content:space-between; align-items:baseline;
}
.clock .time{ font-family:'Orbitron',sans-serif; font-size:1.4rem; color:var(--accent2); text-shadow:0 0 10px var(--accent2); }
.clock .date{ font-size:0.8rem; color:var(--muted); text-transform:capitalize; }

main{ flex:1; padding:14px 18px 100px; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);
  padding:12px; cursor:pointer;
  min-height:110px;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:box-shadow .15s, transform .15s;
}
.card:active{ transform:scale(0.97); }
.card:hover{ box-shadow:0 0 0 1px var(--accent), 0 0 16px -4px var(--accent); }
.card img{ width:100%; height:70px; object-fit:cover; border-radius:10px; margin-bottom:6px; }
.card .ct{ font-weight:600; font-size:0.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .cs{ font-size:0.75rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
.card .cd{ font-size:0.68rem; color:var(--accent2); margin-top:8px; }

.empty{ text-align:center; color:var(--muted); margin-top:60px; font-size:0.9rem; }

.fab{
  position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:58px; height:58px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  border:none; color:#0a0a14; font-size:1.8rem; font-weight:800;
  box-shadow:0 0 18px var(--accent), 0 0 34px -6px var(--accent2);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:6;
}

.sheet{
  position:fixed; inset:0; background:rgba(6,4,12,0.6); backdrop-filter:blur(3px);
  display:none; align-items:flex-end; z-index:20;
}
.sheet.open{ display:flex; }
.sheet-inner{
  background:var(--bg1); width:100%; max-height:88vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--accent);
  box-shadow:0 -6px 30px -8px var(--accent);
}
.sheet-inner h2{ font-family:'Orbitron',sans-serif; color:var(--accent); font-size:1.1rem; margin:0 0 14px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:0.75rem; color:var(--muted); margin-bottom:6px; }
input[type=text], textarea{
  width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
  border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:0.95rem;
}
textarea{ min-height:140px; resize:vertical; }
input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 8px -2px var(--accent); }
.imgs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.imgs .thumb{ position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; }
.imgs .thumb img{ width:100%; height:100%; object-fit:cover; }
.imgs .thumb button{
  position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.65); color:#fff;
  border:none; border-radius:50%; width:18px; height:18px; font-size:0.65rem; cursor:pointer;
}
.upload-btn{
  display:inline-block; padding:9px 14px; border-radius:10px; font-size:0.85rem;
  border:1px dashed var(--accent2); color:var(--accent2); cursor:pointer;
}
.row{ display:flex; gap:10px; margin-top:16px; }
.btn{
  flex:1; padding:12px; border-radius:12px; border:none; font-weight:600; font-size:0.9rem; cursor:pointer;
}
.btn-primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a14; box-shadow:0 0 14px -3px var(--accent); }
.btn-ghost{ background:rgba(255,255,255,0.06); color:var(--text); border:1px solid rgba(255,255,255,0.15); }
.btn-danger{ background:rgba(255,40,80,0.12); color:#ff5578; border:1px solid #ff5578; }

.swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.sw{ width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.sw.active{ border-color:#fff; }
.colorpair{ display:flex; gap:10px; align-items:center; }
input[type=color]{ width:44px; height:34px; border:none; border-radius:8px; background:none; padding:0; cursor:pointer; }
.bgpick{ display:flex; gap:10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>NeoNotas</h1>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">-</div>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyMsg" style="display:none;">Aún no tienes notas. Toca + para crear la primera ✨</div>
  </main>
  <button class="fab" id="addBtn">+</button>
</div>

<!-- Editor sheet -->
<div class="sheet" id="editorSheet">
  <div class="sheet-inner">
    <h2 id="editorTitle">Nueva nota</h2>
    <div class="field">
      <label>Título</label>
      <input type="text" id="noteTitleInput" placeholder="Escribe un título...">
    </div>
    <div class="field">
      <label>Contenido</label>
      <textarea id="noteBodyInput" placeholder="Escribe tu nota..."></textarea>
    </div>
    <div class="field">
      <label>Imágenes</label>
      <label class="upload-btn">📷 Añadir imagen<input type="file" id="imgInput" accept="image/*" multiple style="display:none;"></label>
      <div class="imgs" id="imgsPreview"></div>
    </div>
    <div class="row">
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Eliminar</button>
      <button class="btn btn-primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="settingsSheet">
  <div class="sheet-inner">
    <h2>Personalizar</h2>
    <div class="field">
      <label>Color neón principal</label>
      <div class="swatches" id="accentSwatches"></div>
      <div class="colorpair" style="margin-top:8px;">
        <input type="color" id="accentCustom">
        <span style="font-size:0.75rem;color:var(--muted);">Personalizado</span>
      </div>
    </div>
    <div class="field">
      <label>Color neón secundario</label>
      <div class="colorpair">
        <input type="color" id="accent2Custom">
        <span style="font-size:0.75rem;color:var(--muted);">Usado en el reloj y detalles</span>
      </div>
    </div>
    <div class="field">
      <label>Fondo</label>
      <div class="bgpick">
        <div class="colorpair">
          <input type="color" id="bgColorCustom">
          <span style="font-size:0.75rem;color:var(--muted);">Color</span>
        </div>
        <label class="upload-btn">🖼️ Imagen<input type="file" id="bgImgInput" accept="image/*" style="display:none;"></label>
        <button class="btn btn-ghost" id="bgResetBtn" style="flex:none;padding:9px 12px;">Restablecer</button>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="closeSettingsBtn">Listo</button>
    </div>
  </div>
</div>

<script>
const NEON = ["#ff2fd0","#00f0ff","#39ff14","#ffe600","#ff5f1f","#b967ff"];
let state = { notes: [], settings: { accent:"#ff2fd0", accent2:"#00f0ff", bgColor:null, bgImg:null } };
let editingId = null;
let pendingImgs = [];

function load(){
  try{
    const raw = localStorage.getItem('neonotes_data');
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ console.error('load error', e); }
}
function save(){
  try{ localStorage.setItem('neonotes_data', JSON.stringify(state)); }
  catch(e){ console.error('save error', e); }
}

function applyTheme(){
  const s = state.settings;
  document.documentElement.style.setProperty('--accent', s.accent);
  document.documentElement.style.setProperty('--accent2', s.accent2);
  if(s.bgImg){
    document.body.style.backgroundImage = `url(${s.bgImg})`;
    document.body.classList.add('has-img');
  } else {
    document.body.style.backgroundImage = '';
    document.body.classList.remove('has-img');
    if(s.bgColor){
      document.body.style.background = s.bgColor;
    } else {
      document.body.style.background = '';
    }
  }
}

function renderSwatches(){
  const box = document.getElementById('accentSwatches');
  box.innerHTML = '';
  NEON.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'sw' + (state.settings.accent===c?' active':'');
    d.style.background = c;
    d.onclick = ()=>{ state.settings.accent=c; save(); applyTheme(); renderSwatches(); };
    box.appendChild(d);
  });
  document.getElementById('accentCustom').value = state.settings.accent;
  document.getElementById('accent2Custom').value = state.settings.accent2;
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyMsg');
  grid.innerHTML = '';
  const sorted = [...state.notes].sort((a,b)=>b.updated-a.updated);
  empty.style.display = sorted.length? 'none':'block';
  sorted.forEach(n=>{
    const c = document.createElement('div');
    c.className = 'card';
    c.onclick = ()=>openEditor(n.id);
    let html = '';
    if(n.images && n.images.length){ html += `<img src="${n.images[0]}">`; }
    html += `<div><div class="ct">${escapeHtml(n.title||'Sin título')}</div><div class="cs">${escapeHtml((n.body||'').slice(0,60))}</div></div>`;
    html += `<div class="cd">${fmtDate(n.updated)}</div>`;
    c.innerHTML = html;
    grid.appendChild(c);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function openEditor(id){
  editingId = id || null;
  pendingImgs = [];
  const titleEl = document.getElementById('editorTitle');
  const del = document.getElementById('deleteBtn');
  if(id){
    const n = state.notes.find(x=>x.id===id);
    document.getElementById('noteTitleInput').value = n.title||'';
    document.getElementById('noteBodyInput').value = n.body||'';
    pendingImgs = [...(n.images||[])];
    titleEl.textContent = 'Editar nota';
    del.style.display = 'block';
  } else {
    document.getElementById('noteTitleInput').value = '';
    document.getElementById('noteBodyInput').value = '';
    titleEl.textContent = 'Nueva nota';
    del.style.display = 'none';
  }
  renderImgsPreview();
  document.getElementById('editorSheet').classList.add('open');
}
function closeEditor(){ document.getElementById('editorSheet').classList.remove('open'); }

function renderImgsPreview(){
  const box = document.getElementById('imgsPreview');
  box.innerHTML = '';
  pendingImgs.forEach((src,i)=>{
    const t = document.createElement('div');
    t.className = 'thumb';
    t.innerHTML = `<img src="${src}"><button data-i="${i}">✕</button>`;
    t.querySelector('button').onclick = (e)=>{ pendingImgs.splice(+e.target.dataset.i,1); renderImgsPreview(); };
    box.appendChild(t);
  });
}

document.getElementById('imgInput').addEventListener('change', (e)=>{
  [...e.target.files].forEach(f=>{
    const r = new FileReader();
    r.onload = ()=>{ pendingImgs.push(r.result); renderImgsPreview(); };
    r.readAsDataURL(f);
  });
  e.target.value = '';
});

document.getElementById('saveBtn').onclick = ()=>{
  const title = document.getElementById('noteTitleInput').value.trim();
  const body = document.getElementById('noteBodyInput').value.trim();
  if(!title && !body && !pendingImgs.length){ closeEditor(); return; }
  if(editingId){
    const n = state.notes.find(x=>x.id===editingId);
    n.title=title; n.body=body; n.images=pendingImgs; n.updated=Date.now();
  } else {
    state.notes.push({ id: 'n'+Date.now(), title, body, images:pendingImgs, updated:Date.now() });
  }
  save(); renderGrid(); closeEditor();
};
document.getElementById('cancelBtn').onclick = closeEditor;
document.getElementById('deleteBtn').onclick = ()=>{
  state.notes = state.notes.filter(x=>x.id!==editingId);
  save(); renderGrid(); closeEditor();
};
document.getElementById('addBtn').onclick = ()=>openEditor(null);

// Settings
document.getElementById('settingsBtn').onclick = ()=>{ renderSwatches(); document.getElementById('settingsSheet').classList.add('open'); };
document.getElementById('closeSettingsBtn').onclick = ()=>document.getElementById('settingsSheet').classList.remove('open');
document.getElementById('accentCustom').addEventListener('input', e=>{ state.settings.accent=e.target.value; save(); applyTheme(); });
document.getElementById('accent2Custom').addEventListener('input', e=>{ state.settings.accent2=e.target.value; save(); applyTheme(); });
document.getElementById('bgColorCustom').addEventListener('input', e=>{ state.settings.bgColor=e.target.value; state.settings.bgImg=null; save(); applyTheme(); });
document.getElementById('bgImgInput').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ state.settings.bgImg = r.result; save(); applyTheme(); };
  r.readAsDataURL(f);
});
document.getElementById('bgResetBtn').onclick = ()=>{ state.settings.bgColor=null; state.settings.bgImg=null; save(); applyTheme(); };

function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clockDate').textContent = now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
}

load();
applyTheme();
renderGrid();
tickClock();
setInterval(tickClock, 1000*20);

// Registro de un Service Worker mínimo (habilita "instalable" / funcionamiento offline básico)
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(err => console.warn('SW registration failed:', err));
}
</script>
</body>
